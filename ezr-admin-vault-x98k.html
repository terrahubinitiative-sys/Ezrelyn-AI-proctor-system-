<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="KnK7fMRavFEkhzW_yI5F8W7LAt7twSg7p9Aj5OWXHwc" />
    <title>Admin Vault | Ezrelyn AI Proctor Engine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #080c14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-img {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #38bdf8;
        }
        .header-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 0.72rem;
            color: #38bdf8;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
        }
        .logout-btn {
            background: #7f1d1d;
            color: #fca5a5;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .card-title {
            font-size: 1.05rem;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: #080c14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }
        .form-control:focus {
            border-color: #38bdf8;
        }
        textarea.form-control {
            font-family: monospace;
            font-size: 0.82rem;
            height: 140px;
            resize: vertical;
        }
        .btn-inject {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            text-align: center;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .module-list-item {
            background: #080c14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .module-info {
            font-size: 0.85rem;
        }
        .module-title {
            font-weight: bold;
            color: #38bdf8;
        }
        .module-meta {
            font-size: 0.75rem;
            color: #64748b;
        }
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .edit-btn {
            background: #0369a1;
            color: #e0f2fe;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .delete-btn {
            background: #991b1b;
            color: #fecaca;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Custom Dark Colored Popup Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            width: 85%;
            max-width: 380px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .modal-message {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .modal-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="Sarah.jpg" class="avatar-img" alt="Ezrelyn Admin">
            <div>
                <div class="header-title">EZRELYN ADMIN ENGINE</div>
                <div class="header-subtitle">Course & Exam Control Center</div>
            </div>
        </div>
        <div class="header-right">
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="login.html" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="container">
        <!-- INJECTOR FORM -->
        <div class="card">
            <div class="card-title">⚡ BULK QUESTION INJECTOR & EXAM MANAGER</div>

            <form id="injectorForm">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-group">
                    <label>EDUCATION LEVEL</label>
                    <select id="eduLevel" class="form-control">
                        <option value="Computer Science">Computer Science</option>
                        <option value="Health Science">Health Science</option>
                        <option value="Business Administration">Business Administration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>COURSE / SUBJECT CODE (e.g. bus1101)</label>
                    <input type="text" id="subjectCode" class="form-control" placeholder="e.g. bus1101" required>
                </div>

                <div class="form-group">
                    <label>TIME LIMIT (MINS)</label>
                    <input type="number" id="timeLimit" class="form-control" value="45" required>
                </div>

                <div class="form-group">
                    <label>EXAM MODULE TITLE</label>
                    <input type="text" id="moduleTitle" class="form-control" placeholder="e.g. Principles of Management Final Exam" required>
                </div>

                <div class="form-group">
                    <label>PASTE QUESTION ARRAY (JSON FORMAT)</label>
                    <textarea id="jsonQuestions" class="form-control" placeholder='[
  {
    "q": "Sample question text here?",
    "a": "Option A",
    "b": "Option B",
    "c": "Option C",
    "d": "Option D",
    "correct": "a",
    "explanation": "Explanation text here."
  }
]' required></textarea>
                </div>

                <button type="submit" class="btn-inject" id="submitBtn">INJECT EXAM MODULE INSTANTLY →</button>
            </form>
        </div>

        <!-- MANAGED MODULES -->
        <div class="card">
            <div class="card-title">📚 MANAGED COURSES & INDIVIDUAL MODULES</div>
            <div id="modulesContainer">
                <p style="font-size: 0.85rem; color: #64748b; font-style: italic;">Loading active modules...</p>
            </div>
        </div>
    </div>

    <!-- Custom Colored Popup Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-card">
            <div class="modal-title" id="modalTitle">NOTIFICATION</div>
            <div class="modal-message" id="modalMessage">Message goes here...</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function showCustomAlert(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        // Get modules from localStorage
        function getModules() {
            const stored = localStorage.getItem('ezrelyn_modules');
            return stored ? JSON.parse(stored) : [];
        }

        // Save modules to localStorage
        function saveModules(modules) {
            localStorage.setItem('ezrelyn_modules', JSON.stringify(modules));
        }

        // Load and render modules instantly
        function loadModules() {
            const container = document.getElementById('modulesContainer');
            const modules = getModules();

            if (modules.length === 0) {
                container.innerHTML = `<p style="font-size:0.85rem; color:#64748b;">No active modules found. Inject one above!</p>`;
                return;
            }

            container.innerHTML = '';
            modules.forEach((m, index) => {
                const item = document.createElement('div');
                item.className = 'module-list-item';
                item.innerHTML = `
                    <div class="module-info">
                        <div class="module-title">[${m.level}] ${m.title}</div>
                        <div class="module-meta">Subject: ${m.subject} | Time: ${m.time} mins</div>
                    </div>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editModule(${index})">Edit</button>
                        <button class="delete-btn" onclick="deleteModule(${index})">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Form Submit: Instant Add / Update
        document.getElementById('injectorForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const level = document.getElementById('eduLevel').value;
            const subject = document.getElementById('subjectCode').value.trim();
            const time = document.getElementById('timeLimit').value;
            const title = document.getElementById('moduleTitle').value.trim();
            const jsonText = document.getElementById('jsonQuestions').value.trim();

            try {
                const questions = JSON.parse(jsonText);
                let modules = getModules();

                const moduleData = { level, subject, time, title, questions };

                if (editIndex === -1) {
                    modules.push(moduleData);
                    showCustomAlert('SUCCESS', 'Module injected successfully! Appears below instantly.');
                } else {
                    modules[editIndex] = moduleData;
                    document.getElementById('editIndex').value = -1;
                    document.getElementById('submitBtn').innerText = 'INJECT EXAM MODULE INSTANTLY →';
                    showCustomAlert('UPDATED', 'Module updated successfully!');
                }

                saveModules(modules);
                document.getElementById('injectorForm').reset();
                document.getElementById('timeLimit').value = '45';
                loadModules();
            } catch (err) {
                showCustomAlert('JSON ERROR', 'Invalid JSON format in question array! Please check your syntax.');
            }
        });

        // Edit Module
        function editModule(index) {
            const modules = getModules();
            const m = modules[index];

            document.getElementById('editIndex').value = index;
            document.getElementById('eduLevel').value = m.level;
            document.getElementById('subjectCode').value = m.subject;
            document.getElementById('timeLimit').value = m.time;
            document.getElementById('moduleTitle').value = m.title;
            document.getElementById('jsonQuestions').value = JSON.stringify(m.questions, null, 2);
            document.getElementById('submitBtn').innerText = 'UPDATE EXAM MODULE →';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete Module
        function deleteModule(index) {
            let modules = getModules();
            modules.splice(index, 1);
            saveModules(modules);
            loadModules();
            showCustomAlert('DELETED', 'Exam module removed successfully.');
        }

        // Initial load on page startup
        loadModules();
    </script>
</body>
</html>
